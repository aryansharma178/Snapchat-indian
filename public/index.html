<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Indian</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 420px; height: 100vh; background: #000; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        @media(min-width: 450px) { .app-container { height: 90vh; border-radius: 24px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); } }

        /* Login Screen Overlay */
        #login-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; }
        #login-screen h2 { font-size: 26px; margin-bottom: 8px; color: #fffc00; }
        #login-screen p { color: #888; font-size: 14px; margin-bottom: 24px; }
        .input-box { width: 100%; padding: 14px; background: #222; border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 15px; outline: none; margin-bottom: 14px; }
        .login-btn { width: 100%; padding: 14px; background: #fffc00; color: #000; font-weight: 700; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; }

        /* Camera Screen UI (Matches Screenshot) */
        .screen { flex: 1; display: flex; flex-direction: column; position: relative; display: none; }
        .screen.active { display: flex; }

        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; z-index: 10; }
        .profile-avatar { width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 2px solid #fffc00; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #000; font-size: 14px; }
        .top-left-icons { display: flex; align-items: center; gap: 16px; }
        .icon-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .top-right-icons { display: flex; align-items: center; gap: 18px; }
        .badge-icon { position: relative; }
        .badge { position: absolute; top: -5px; right: -8px; background: #fffc00; color: #000; font-size: 10px; font-weight: bold; padding: 1px 4px; border-radius: 8px; }

        /* Right Side Vertical Sidebar */
        .right-sidebar { position: absolute; right: 12px; top: 70px; display: flex; flex-direction: column; gap: 18px; z-index: 10; align-items: center; }
        .side-icon { background: rgba(0,0,0,0.4); width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; color: #fff; border: none; cursor: pointer; backdrop-filter: blur(4px); }

        /* Bottom Shutter & Controls area */
        .camera-footer { position: absolute; bottom: 70px; width: 100%; display: flex; justify-content: space-around; align-items: center; padding: 0 30px; z-index: 10; }
        .gallery-preview { width: 40px; height: 40px; border-radius: 8px; border: 2px solid #fff; background: #333; overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 12px; }
        .shutter-btn { width: 76px; height: 76px; border-radius: 50%; border: 5px solid #fff; background: transparent; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .shutter-inner { width: 60px; height: 60px; border-radius: 50%; background: #fff; }
        .lens-btn { font-size: 28px; background: none; border: none; cursor: pointer; }

        /* Bottom Navigation Bar (5 Tabs) */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 20; }
        .nav-item { background: none; border: none; color: #777; font-size: 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; }
        .nav-item.active { color: #fffc00; }
        .nav-item.active::after { content: ''; position: absolute; bottom: -6px; width: 4px; height: 4px; background: #fffc00; border-radius: 50%; }
        .nav-dot { position: absolute; top: 2px; right: 2px; width: 7px; height: 7px; background: #00d2ff; border-radius: 50%; }
        .nav-dot-purple { position: absolute; top: 2px; right: 2px; width: 7px; height: 7px; background: #b000ff; border-radius: 50%; }

        /* Chat / Conversation Screen UI */
        #chat-screen { background: #121212; padding: 0; }
        .chat-header { background: #181818; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .chat-user-info { display: flex; align-items: center; gap: 10px; }
        .chat-avatar { width: 34px; height: 34px; background: #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 13px; }
        .call-btn-in-chat { background: #22c55e; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; }
        
        #chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 14px; word-break: break-word; }
        .msg.incoming { background: #222; align-self: flex-start; }
        .msg.outgoing { background: #fffc00; color: #000; align-self: flex-end; font-weight: 500; }
        
        .chat-input-area { padding: 12px 16px; background: #181818; display: flex; gap: 10px; align-items: center; border-top: 1px solid #222; }
        .chat-input-area input { flex: 1; padding: 10px 16px; background: #2a2a2a; border: none; border-radius: 20px; color: #fff; outline: none; font-size: 14px; }
        .send-msg-btn { background: #fffc00; color: #000; border: none; width: 38px; height: 38px; border-radius: 50%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Login Modal -->
        <div id="login-screen">
            <h2>👻 Snapchat Indian</h2>
            <p>Enter your profile details</p>
            <input type="text" id="name" class="input-box" placeholder="Your Name">
            <input type="text" id="username" class="input-box" placeholder="Username (e.g. jhapki_user)">
            <button class="login-btn" onclick="login()">Continue</button>
        </div>

        <!-- 1. MAP SCREEN -->
        <div id="map-screen" class="screen">
            <div class="top-bar">
                <div class="profile-avatar" id="user-initial">A</div>
                <h3>Snap Map</h3>
            </div>
            <div style="flex:1; display:flex; justify-content:center; align-items:center; color:#555;">Map view unavailable</div>
        </div>

        <!-- 2. CHAT CONVERSATION SCREEN (Calling button is inside here!) -->
        <div id="chat-screen" class="screen">
            <div class="chat-header">
                <div class="chat-user-info">
                    <div class="chat-avatar" id="chat-avatar-text">U</div>
                    <div>
                        <h4 id="chat-room-name" style="font-size: 15px;">Jhapki Community</h4>
                        <span style="font-size: 11px; color: #22c55e;">Online</span>
                    </div>
                </div>
                <!-- Calling button strictly inside chat conversation header -->
                <button class="call-btn-in-chat" onclick="startVoiceCall()" title="Voice Call">📞</button>
            </div>
            <div id="chat-box"></div>
            <div class="chat-input-area">
                <input type="text" id="message" placeholder="Send a snap..." onkeypress="handleKey(event)">
                <button class="send-msg-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- 3. CAMERA SCREEN (Exact Screenshot Replica) -->
        <div id="camera-screen" class="screen active">
            <div class="top-bar">
                <div class="top-left-icons">
                    <div class="profile-avatar" id="cam-profile-avatar" onclick="switchTab('profile')">A</div>
                    <button class="icon-btn">🔍</button>
                </div>
                <div class="top-right-icons">
                    <button class="icon-btn badge-icon">👤+ <span class="badge">68</span></button>
                </div>
            </div>

            <!-- Right Sidebar Tool Icons -->
            <div class="right-sidebar">
                <button class="side-icon">🔄</button>
                <button class="side-icon">⚡</button>
                <button class="side-icon">🌙</button>
                <button class="side-icon">▶️</button>
                <button class="side-icon">🎵</button>
                <button class="side-icon">📑</button>
            </div>

            <!-- Camera Shutter Footer -->
            <div class="camera-footer">
                <div class="gallery-preview">🖼️</div>
                <button class="shutter-btn" onclick="captureSnap()"><div class="shutter-inner"></div></button>
                <button class="lens-btn">😃</button>
            </div>
        </div>

        <!-- 4. STORIES SCREEN -->
        <div id="stories-screen" class="screen">
            <div class="top-bar">
                <h3>Stories</h3>
            </div>
            <div style="flex:1; display:flex; justify-content:center; align-items:center; color:#555;">No active stories</div>
        </div>

        <!-- 5. SPOTLIGHT SCREEN -->
        <div id="spotlight-screen" class="screen">
            <div class="top-bar">
                <h3>Spotlight</h3>
            </div>
            <div style="flex:1; display:flex; justify-content:center; align-items:center; color:#555;">Spotlight feed empty</div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <button class="nav-item" onclick="switchTab('map')">📍</button>
            <button class="nav-item" onclick="switchTab('chat')">
                💬
                <span class="nav-dot"></span>
            </button>
            <button class="nav-item active" onclick="switchTab('camera')">
                📷
            </button>
            <button class="nav-item" onclick="switchTab('stories')">
                👥
                <span class="nav-dot-purple"></span>
            </button>
            <button class="nav-item" onclick="switchTab('spotlight')">▶️</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;

        async function login() {
            const name = document.getElementById('name').value.trim();
            const username = document.getElementById('username').value.trim();
            if (!name || !username) {
                alert('Please enter name and username');
                return;
            }
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, username })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                document.getElementById('login-screen').style.display = 'none';
                const initial = currentUser.name.charAt(0).toUpperCase();
                document.getElementById('user-initial').innerText = initial;
                document.getElementById('cam-profile-avatar').innerText = initial;
                document.getElementById('chat-avatar-text').innerText = initial;
            } else {
                alert(data.message);
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            if (tabName === 'map') {
                document.getElementById('map-screen').classList.add('active');
            } else if (tabName === 'chat') {
                document.getElementById('chat-screen').classList.add('active');
            } else if (tabName === 'camera') {
                document.getElementById('camera-screen').classList.add('active');
            } else if (tabName === 'stories') {
                document.getElementById('stories-screen').classList.add('active');
            } else if (tabName === 'spotlight') {
                document.getElementById('spotlight-screen').classList.add('active');
            }
            
            // Highlight icon if tab matches
            event.currentTarget.classList.add('active');
        }

        function captureSnap() {
            alert("Snap captured successfully!");
        }

        function startVoiceCall() {
            alert("Connecting voice call in conversation...");
        }

        function sendMessage() {
            const msgInput = document.getElementById('message');
            const msg = msgInput.value.trim();
            if (!msg) return;
            socket.emit('send_snap', { sender: currentUser.name, message: msg });
            msgInput.value = '';
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        socket.on('receive_snap', (data) => {
            const box = document.getElementById('chat-box');
            const isSelf = currentUser && data.sender === currentUser.name;
            const bubbleClass = isSelf ? 'outgoing' : 'incoming';
            
            box.innerHTML += `
                <div class="msg \${bubbleClass}">
                    <span style="font-size:10px; font-weight:bold; display:block; opacity:0.7;">\${data.sender}</span>
                    \${data.message}
                </div>`;
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
