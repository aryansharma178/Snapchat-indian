<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhapki - Snapchat Experience</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <meta name="theme-color" content="#fffc00">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 420px; height: 100vh; background: #000; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        @media(min-width: 450px) { .app-container { height: 90vh; border-radius: 24px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); } }

        #login-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; }
        #login-screen h2 { font-size: 28px; margin-bottom: 8px; color: #fffc00; }
        #login-screen p { color: #888; font-size: 14px; margin-bottom: 24px; }
        .input-box { width: 100%; padding: 14px; background: #222; border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 15px; outline: none; margin-bottom: 14px; }
        .login-btn { width: 100%; padding: 14px; background: #fffc00; color: #000; font-weight: 700; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; }

        .screen { flex: 1; display: flex; flex-direction: column; position: relative; display: none; }
        .screen.active { display: flex; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; z-index: 10; }
        .top-left-group { display: flex; align-items: center; gap: 12px; }
        .profile-avatar { width: 38px; height: 38px; border-radius: 50%; background: #222; border: 2px solid #fffc00; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #000; font-size: 18px; cursor: pointer; }
        .icon-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        #camera-screen { background: #000; }
        #webcam-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

        .camera-footer { position: absolute; bottom: 75px; width: 100%; display: flex; justify-content: space-around; align-items: center; padding: 0 35px; z-index: 10; }
        .shutter-btn { width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff; background: transparent; cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 10; }
        .shutter-inner { width: 62px; height: 62px; border-radius: 50%; background: #fff; }

        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 20; }
        .nav-item { background: none; border: none; color: #777; font-size: 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .nav-item.active { color: #fffc00; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="login-screen">
            <h2>👻 Jhapki</h2>
            <p>Login & User Search System</p>
            <input type="text" id="name" class="input-box" placeholder="Your Name">
            <input type="text" id="username" class="input-box" placeholder="Username">
            <button class="login-btn" onclick="login()">Enter Jhapki</button>
        </div>

        <div id="camera-screen" class="screen active">
            <video id="webcam-video" autoplay playsinline></video>
            <div class="top-bar">
                <div class="top-left-group">
                    <div class="profile-avatar">👦</div>
                    <button class="icon-btn" onclick="openSearch()">🔍</button>
                </div>
            </div>
            <div class="camera-footer">
                <button class="shutter-btn"><div class="shutter-inner"></div></button>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item active">📷</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;

        async function login() {
            const name = document.getElementById('name').value.trim();
            const username = document.getElementById('username').value.trim();
            if (!name || !username) {
                alert('Enter name and username');
                return;
            }
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, username })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                document.getElementById('login-screen').style.display = 'none';
                alert('Login successful! Now you can search users.');
            }
        }

        async function openSearch() {
            let query = prompt("Search username or name:");
            if (!query) return;
            try {
                const res = await fetch(`/api/users/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data.success && data.users.length > 0) {
                    let resultText = "Found Users:\n";
                    data.users.forEach(u => {
                        resultText += `• ${u.name} (@${u.username})\n`;
                    });
                    alert(resultText);
                } else {
                    alert("No user found with this username!");
                }
            } catch (err) {
                alert("Search failed. Check connection.");
            }
        }
    </script>
</body>
</html>
