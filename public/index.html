<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Snapchat</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        #chat { max-width: 400px; margin: auto; background: #222; padding: 15px; border-radius: 10px; }
        input, button { padding: 10px; margin: 5px; width: 80%; border-radius: 5px; border: none; }
        button { background: #FFFC00; font-weight: bold; cursor: pointer; }
        #messages { text-align: left; max-height: 200px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>👻 Indian Snapchat</h1>
    <div id="chat">
        <input id="sender" placeholder="Your Name" />
        <input id="message" placeholder="Send a Snap/Message..." />
        <button onclick="sendSnap()">Send</button>
        <div id="messages"></div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function sendSnap() {
            const sender = document.getElementById('sender').value;
            const message = document.getElementById('message').value;
            if(sender && message) {
                socket.emit('send_snap', { sender, message });
                document.getElementById('message').value = '';
            }
        }
        socket.on('receive_snap', (data) => {
            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML += `<p><b>${data.sender}:</b> ${data.message}</p>`;
        });
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Snapchat</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 15px; }
        #app { max-width: 400px; margin: auto; background: #222; padding: 15px; border-radius: 10px; }
        input, button { padding: 10px; margin: 5px; width: 85%; border-radius: 5px; border: none; }
        button { background: #FFFC00; font-weight: bold; cursor: pointer; }
        #messages { text-align: left; max-height: 250px; overflow-y: auto; margin-top: 10px; }
        .snap-card { background: #333; padding: 8px; margin: 5px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="app">
        <h2>👻 Indian Snapchat</h2>
        <p style="font-size: 12px; color: #00ffcc;">Online Users: <span id="onlineCount">0</span></p>
        
        <input id="sender" placeholder="Your Name" />
        <input id="message" placeholder="Optional text/caption..." />
        <input type="file" id="imageInput" accept="image/*" capture="environment" style="color: #fff;" />
        <button onclick="sendSnap()">Send Snap 📸</button>
        
        <div id="messages"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on('online_count', (count) => {
            document.getElementById('onlineCount').innerText = count;
        });

        function sendSnap() {
            const sender = document.getElementById('sender').value;
            const message = document.getElementById('message').value;
            const fileInput = document.getElementById('imageInput');

            if (!sender) {
                alert('Please enter your name!');
                return;
            }

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = () => {
                    socket.emit('send_snap', { sender, message, image: reader.result });
                    fileInput.value = '';
                    document.getElementById('message').value = '';
                };
            } else if (message) {
                socket.emit('send_snap', { sender, message, image: null });
                document.getElementById('message').value = '';
            }
        }

        socket.on('receive_snap', (data) => {
            const msgDiv = document.getElementById('messages');
            const id = 'snap_' + Math.random().toString(36).substr(2, 9);
            
            let html = `<div class="snap-card" id="${id}"><b>${data.sender}:</b> `;
            if (data.message) html += `<span>${data.message}</span>`;
            if (data.image) {
                html += `<br><button style="background:#ff4757; color:#fff;" onclick="viewSnap('${id}', '${data.image}')">Tap to View Snap 👁️</button>`;
            }
            html += `</div>`;
            msgDiv.innerHTML += html;
        });

        function viewSnap(id, imgData) {
            const card = document.getElementById(id);
            card.innerHTML = `<img src="${imgData}" style="width:100%; border-radius:5px;" /><p style="color:red; font-size:12px;">Disappearing in 5s...</p>`;
            setTimeout(() => {
                card.innerHTML = `<i>[Snap Opened & Destroyed]</i>`;
                setTimeout(() => card.remove(), 2000);
            }, 5000);
        }
    </script>
</body>
</html>
