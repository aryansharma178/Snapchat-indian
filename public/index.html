<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhapki</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 420px; height: 100vh; background: #000; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        @media(min-width: 450px) { .app-container { height: 90vh; border-radius: 24px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); } }

        /* Login Screen */
        #login-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; }
        #login-screen h2 { font-size: 26px; margin-bottom: 8px; color: #fffc00; }
        #login-screen p { color: #888; font-size: 14px; margin-bottom: 24px; }
        .input-box { width: 100%; padding: 14px; background: #222; border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 15px; outline: none; margin-bottom: 14px; }
        .login-btn { width: 100%; padding: 14px; background: #fffc00; color: #000; font-weight: 700; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; }

        /* Avatar Studio Modal */
        #avatar-studio { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 110; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
        .studio-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .studio-header h3 { color: #fffc00; font-size: 20px; }
        .close-studio { background: #333; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
        
        .avatar-preview-box { width: 140px; height: 140px; background: linear-gradient(135deg, #ff007f, #7928ca); border: 3px solid #fffc00; border-radius: 24px; margin: 0 auto 16px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 55px; box-shadow: 0 8px 25px rgba(255,252,0,0.3); position: relative; transition: all 0.3s ease; }
        .avatar-preview-box span { position: relative; display: inline-block; transform: translateY(0); transition: transform 0.2s; }
        
        .customizer-section { margin-bottom: 14px; }
        .customizer-section label { font-size: 13px; color: #aaa; display: block; margin-bottom: 6px; }
        .option-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .option-btn { background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; font-size: 12px; cursor: pointer; text-align: center; }
        .option-btn.selected { background: #fffc00; color: #000; font-weight: bold; border-color: #fffc00; }
        .save-avatar-btn { width: 100%; padding: 14px; background: #fffc00; color: #000; font-weight: 700; border: none; border-radius: 12px; margin-top: 15px; cursor: pointer; font-size: 15px; }

        /* Screens */
        .screen { flex: 1; display: flex; flex-direction: column; position: relative; display: none; }
        .screen.active { display: flex; }

        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; z-index: 10; }
        .profile-avatar { width: 38px; height: 38px; border-radius: 50%; background: #222; border: 2px solid #fffc00; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #000; font-size: 18px; cursor: pointer; overflow: hidden; background-size: cover; }
        .top-left-icons { display: flex; align-items: center; gap: 16px; }
        .icon-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .top-right-icons { display: flex; align-items: center; gap: 18px; }
        .badge-icon { position: relative; font-size: 16px; background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 20px; display: flex; align-items: center; gap: 4px; border: none; color: #fff; cursor: pointer; }
        .badge { background: #fffc00; color: #000; font-size: 10px; font-weight: bold; padding: 1px 5px; border-radius: 8px; }

        /* Right Side Vertical Sidebar */
        .right-sidebar { position: absolute; right: 12px; top: 70px; display: flex; flex-direction: column; gap: 16px; z-index: 10; align-items: center; }
        .side-icon { background: rgba(0,0,0,0.4); width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; color: #fff; border: none; cursor: pointer; backdrop-filter: blur(4px); transition: transform 0.1s; }
        .side-icon.active-toggle { background: #fffc00; color: #000; }
        .side-icon:active { transform: scale(0.9); }

        /* Camera View & Shutter */
        #camera-screen { background: #000; }
        #webcam-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .camera-footer { position: absolute; bottom: 70px; width: 100%; display: flex; justify-content: space-around; align-items: center; padding: 0 30px; z-index: 10; }
        .gallery-preview { width: 42px; height: 42px; border-radius: 10px; border: 2px solid #fff; background: #333; overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; }
        .shutter-btn { width: 76px; height: 76px; border-radius: 50%; border: 5px solid #fff; background: transparent; cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 10; }
        .shutter-inner { width: 60px; height: 60px; border-radius: 50%; background: #fff; transition: transform 0.1s; }
        .shutter-btn:active .shutter-inner { transform: scale(0.85); }
        .lens-btn { font-size: 28px; background: none; border: none; cursor: pointer; width: 42px; height: 42px; display: flex; justify-content: center; align-items: center; z-index: 10; }

        /* Bottom Navigation Bar */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 20; }
        .nav-item { background: none; border: none; color: #777; font-size: 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; padding: 10px; }
        .nav-item.active { color: #fffc00; }
        .nav-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: #00d2ff; border-radius: 50%; }
        .nav-dot-purple { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: #b000ff; border-radius: 50%; }

        /* Chat Screen */
        #chat-screen { background: #121212; padding: 0; z-index: 15; }
        .chat-header { background: #181818; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .chat-user-info { display: flex; align-items: center; gap: 10px; }
        .chat-avatar { width: 34px; height: 34px; background: #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; color: #fffc00; }
        .call-btn-in-chat { background: #22c55e; color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 18px; box-shadow: 0 2px 8px rgba(34,197,94,0.4); }
        
        #chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 14px; word-break: break-word; display: flex; gap: 8px; align-items: flex-start; }
        .msg.incoming { background: #222; align-self: flex-start; }
        .msg.outgoing { background: #fffc00; color: #000; align-self: flex-end; font-weight: 500; }
        
        .chat-input-area { padding: 12px 16px; background: #181818; display: flex; gap: 10px; align-items: center; border-top: 1px solid #222; }
        .chat-input-area input { flex: 1; padding: 10px 16px; background: #2a2a2a; border: none; border-radius: 20px; color: #fff; outline: none; font-size: 14px; }
        .send-msg-btn { background: #fffc00; color: #000; border: none; width: 38px; height: 38px; border-radius: 50%; font-weight: bold; cursor: pointer; }

        /* Flash Screen Effect */
        #flash-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:#fff; z-index:99; opacity:0; pointer-events:none; transition: opacity 0.2s; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="flash-overlay"></div>

        <!-- Login Screen -->
        <div id="login-screen">
            <h2>👻 Jhapki</h2>
            <p>Enter your profile details</p>
            <input type="text" id="name" class="input-box" placeholder="Your Name">
            <input type="text" id="username" class="input-box" placeholder="Username">
            <button class="login-btn" onclick="login()">Continue</button>
        </div>

        <!-- Avatar Studio Modal / Screen -->
        <div id="avatar-studio">
            <div class="studio-header">
                <h3>Jhapki Avatar Studio</h3>
                <button class="close-studio" onclick="closeAvatarStudio()">✕ Close</button>
            </div>
            
            <div class="avatar-preview-box" id="avatar-preview-box">
                <span id="avatar-preview-icon">👦🕺</span>
            </div>
            
            <div class="customizer-section">
                <label>Avatar Background Theme</label>
                <div class="option-grid">
                    <button class="option-btn selected" onclick="setAvatarOption('bg', 'neon', this)">✨ Neon Party</button>
                    <button class="option-btn" onclick="setAvatarOption('bg', 'sunset', this)">🌅 Sunset Glow</button>
                    <button class="option-btn" onclick="setAvatarOption('bg', 'royal', this)">👑 Royal Gold</button>
                    <button class="option-btn" onclick="setAvatarOption('bg', 'cyber', this)">⚡ Cyber City</button>
                </div>
            </div>

            <div class="customizer-section">
                <label>Select Gender / Type</label>
                <div class="option-grid">
                    <button class="option-btn selected" onclick="setAvatarOption('gender', 'boy', this)">👦 Party Boy</button>
                    <button class="option-btn" onclick="setAvatarOption('gender', 'girl', this)">👧 Party Girl</button>
                    <button class="option-btn" onclick="setAvatarOption('gender', 'cool', this)">😎 Cool Vibe</button>
                </div>
            </div>

            <div class="customizer-section">
                <label>Avatar Position & Scale</label>
                <div class="option-grid">
                    <button class="option-btn selected" onclick="setAvatarOption('pos', 'center', this)">🎯 Center</button>
                    <button class="option-btn" onclick="setAvatarOption('pos', 'bounce', this)">🦘 Bounce</button>
                    <button class="option-btn" onclick="setAvatarOption('pos', 'zoomed', this)">🔍 Zoomed</button>
                </div>
            </div>

            <button class="save-avatar-btn" onclick="saveAvatar()">Save & Apply Avatar</button>
        </div>

        <!-- 1. MAP SCREEN -->
        <div id="map-screen" class="screen">
            <div class="top-bar" style="background:#0f172a;">
                <div class="profile-avatar" id="map-avatar" onclick="openAvatarStudio()">👦</div>
                <h3>Snap Map</h3>
                <button class="icon-btn" onclick="alert('Map Settings Opened')">⚙️</button>
            </div>
            <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#1e293b; color:#94a3b8; gap:10px;">
                <span style="font-size:40px;">📍</span>
                <p>Live Location sharing is active with friends.</p>
            </div>
        </div>

        <!-- 2. CHAT CONVERSATION SCREEN -->
        <div id="chat-screen" class="screen">
            <div class="chat-header">
                <div class="chat-user-info">
                    <div class="chat-avatar" id="chat-avatar-text">👦</div>
                    <div>
                        <h4 id="chat-room-name" style="font-size: 15px;">Jhapki Community</h4>
                        <span style="font-size: 11px; color: #22c55e;">Online</span>
                    </div>
                </div>
                <button class="call-btn-in-chat" onclick="startVoiceCall()" title="Voice Call">📞</button>
            </div>
            <div id="chat-box"></div>
            <div class="chat-input-area">
                <input type="text" id="message" placeholder="Send a snap..." onkeypress="handleKey(event)">
                <button class="send-msg-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- 3. CAMERA SCREEN -->
        <div id="camera-screen" class="screen active">
            <video id="webcam-video" autoplay playsinline></video>
            
            <div class="top-bar">
                <div class="top-left-icons">
                    <div class="profile-avatar" id="cam-profile-avatar" onclick="openAvatarStudio()" title="Customize Avatar">👦</div>
                    <button class="icon-btn" onclick="openSearch()">🔍</button>
                </div>
                <div class="top-right-icons">
                    <button class="badge-icon" onclick="openAddFriends()">👤+ <span class="badge">68</span></button>
                </div>
            </div>

            <!-- Right Sidebar Active Tools -->
            <div class="right-sidebar">
                <button class="side-icon" id="flip-btn" onclick="flipCamera()" title="Flip Camera">🔄</button>
                <button class="side-icon" id="flash-btn" onclick="toggleFlash()" title="Flash">⚡</button>
                <button class="side-icon" id="night-btn" onclick="toggleNightMode()" title="Night Mode">🌙</button>
                <button class="side-icon" onclick="alert('Multi-Snap mode activated')">▶️</button>
                <button class="side-icon" onclick="alert('Music library opened')">🎵</button>
                <button class="side-icon" onclick="alert('Director mode options')">📑</button>
            </div>

            <!-- Camera Shutter Footer -->
            <div class="camera-footer">
                <input type="file" id="gallery-input" style="display:none" accept="image/*" onchange="previewGallery(event)">
                <div class="gallery-preview" onclick="document.getElementById('gallery-input').click()" title="Open Gallery">🖼️</div>
                <button class="shutter-btn" onclick="captureSnap()"><div class="shutter-inner"></div></button>
                <button class="lens-btn" onclick="alert('AR Lenses Menu Activated')">😃</button>
            </div>
        </div>

        <!-- 4. STORIES SCREEN -->
        <div id="stories-screen" class="screen">
            <div class="top-bar" style="background:#181818;">
                <h3>Stories & Friends</h3>
                <button class="icon-btn" onclick="alert('Story settings')">⚙️</button>
            </div>
            <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#111; color:#aaa; gap:10px;">
                <span style="font-size:40px;">👥</span>
                <p>Tap to view friends' stories and updates.</p>
            </div>
        </div>

        <!-- 5. SPOTLIGHT SCREEN -->
        <div id="spotlight-screen" class="screen">
            <div class="top-bar" style="background:#181818;">
                <h3>Spotlight</h3>
                <button class="icon-btn" onclick="alert('Spotlight trending')">🔥</button>
            </div>
            <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#111; color:#aaa; gap:10px;">
                <span style="font-size:40px;">▶️</span>
                <p>Trending viral entertainment clips.</p>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <button class="nav-item" onclick="switchTab('map', this)">📍</button>
            <button class="nav-item" onclick="switchTab('chat', this)">
                💬
                <span class="nav-dot"></span>
            </button>
            <button class="nav-item active" onclick="switchTab('camera', this)">
                📷
            </button>
            <button class="nav-item" onclick="switchTab('stories', this)">
                👥
                <span class="nav-dot-purple"></span>
            </button>
            <button class="nav-item" onclick="switchTab('spotlight', this)">▶️</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let useFrontCamera = true;
        let mediaStream = null;

        // Avatar Customization State with Background and Position
        let currentAvatar = {
            gender: 'boy',
            bg: 'neon',
            pos: 'center'
        };

        async function login() {
            const name = document.getElementById('name').value.trim();
            const username = document.getElementById('username').value.trim();
            if (!name || !username) {
                alert('Please enter name and username');
                return;
            }
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, username })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                document.getElementById('login-screen').style.display = 'none';
                updateAvatarDisplay();
                startCamera();
            } else {
                alert(data.message);
            }
        }

        function openAvatarStudio() {
            document.getElementById('avatar-studio').style.display = 'flex';
            updatePreviewStyle();
        }

        function closeAvatarStudio() {
            document.getElementById('avatar-studio').style.display = 'none';
        }

        function setAvatarOption(category, value, btn) {
            currentAvatar[category] = value;
            const parent = btn.parentElement;
            parent.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            updatePreviewStyle();
        }

        function updatePreviewStyle() {
            let icon = '👦🕺';
            if (currentAvatar.gender === 'girl') icon = '👧✨';
            if (currentAvatar.gender === 'cool') icon = '😎🔥';
            document.getElementById('avatar-preview-icon').innerText = icon;

            const box = document.getElementById('avatar-preview-box');
            
            // Background Themes
            if (currentAvatar.bg === 'neon') {
                box.style.background = 'linear-gradient(135deg, #ff007f, #7928ca)';
            } else if (currentAvatar.bg === 'sunset') {
                box.style.background = 'linear-gradient(135deg, #ff8008, #ffc837)';
            } else if (currentAvatar.bg === 'royal') {
                box.style.background = 'linear-gradient(135deg, #111111, #433800)';
            } else if (currentAvatar.bg === 'cyber') {
                box.style.background = 'linear-gradient(135deg, #00f2fe, #4facfe)';
            }

            // Position & Scale
            const iconSpan = document.getElementById('avatar-preview-icon');
            if (currentAvatar.pos === 'center') {
                iconSpan.style.transform = 'scale(1) translateY(0)';
            } else if (currentAvatar.pos === 'bounce') {
                iconSpan.style.transform = 'scale(1.1) translateY(-5px)';
            } else if (currentAvatar.pos === 'zoomed') {
                iconSpan.style.transform = 'scale(1.3) translateY(0)';
            }
        }

        function saveAvatar() {
            updateAvatarDisplay();
            closeAvatarStudio();
            alert("✨ Jhapki Avatar with Background & Position successfully saved!");
        }

        function updateAvatarDisplay() {
            let icon = '👦';
            if (currentAvatar.gender === 'girl') icon = '👧';
            if (currentAvatar.gender === 'cool') icon = '😎';

            document.getElementById('map-avatar').innerText = icon;
            document.getElementById('cam-profile-avatar').innerText = icon;
            document.getElementById('chat-avatar-text').innerText = icon;
        }

        // Start Live Webcam
        async function startCamera() {
            try {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                    audio: false
                };
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('webcam-video').srcObject = mediaStream;
            } catch (err) {
                console.log("Camera access error:", err);
            }
        }

        function flipCamera() {
            useFrontCamera = !useFrontCamera;
            startCamera();
            document.getElementById('flip-btn').classList.toggle('active-toggle');
        }

        let flashOn = false;
        function toggleFlash() {
            flashOn = !flashOn;
            const btn = document.getElementById('flash-btn');
            btn.classList.toggle('active-toggle', flashOn);
            alert(flashOn ? "Flashlight turned ON" : "Flashlight turned OFF");
        }

        let nightMode = false;
        function toggleNightMode() {
            nightMode = !nightMode;
            const video = document.getElementById('webcam-video');
            const btn = document.getElementById('night-btn');
            btn.classList.toggle('active-toggle', nightMode);
            video.style.filter = nightMode ? 'brightness(1.8) contrast(1.2)' : 'none';
        }

        function captureSnap() {
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 200);
            alert("📸 Snap Captured Successfully!");
        }

        function previewGallery(event) {
            const file = event.target.files[0];
            if (file) {
                alert("🖼️ Gallery image selected: " + file.name);
            }
        }

        function openSearch() {
            let query = prompt("Search users or stories:");
            if (query) alert("Searching for: " + query);
        }

        function openAddFriends() {
            alert("👥 68 Friend Requests / Suggestions loaded!");
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            if (tabName === 'map') document.getElementById('map-screen').classList.add('active');
            else if (tabName === 'chat') document.getElementById('chat-screen').classList.add('active');
            else if (tabName === 'camera') document.getElementById('camera-screen').classList.add('active');
            else if (tabName === 'stories') document.getElementById('stories-screen').classList.add('active');
            else if (tabName === 'spotlight') document.getElementById('spotlight-screen').classList.add('active');
            
            if (el) el.classList.add('active');
        }

        function startVoiceCall() {
            let confirmCall = confirm("📞 Do you want to start a secure voice call in this chat?");
            if (confirmCall) {
                alert("Calling... Connected with community peer!");
            }
        }

        function sendMessage() {
            const msgInput = document.getElementById('message');
            const msg = msgInput.value.trim();
            if (!msg) return;
            socket.emit('send_snap', { sender: currentUser.name, message: msg, avatar: document.getElementById('cam-profile-avatar').innerText });
            msgInput.value = '';
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }

        socket.on('receive_snap', (data) => {
            const box = document.getElementById('chat-box');
            const isSelf = currentUser && data.sender === currentUser.name;
            const bubbleClass = isSelf ? 'outgoing' : 'incoming';
            const avtr = data.avatar || '👦';
            
            box.innerHTML += `
                <div class="msg \${bubbleClass}">
                    <div style="font-size:18px;">\${avtr}</div>
                    <div>
                        <span style="font-size:10px; font-weight:bold; display:block; opacity:0.7;">\${data.sender}</span>
                        \${data.message}
                    </div>
                </div>`;
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
