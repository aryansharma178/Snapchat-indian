<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Snapchat</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; }
        #chat { max-width: 400px; margin: auto; background: #222; padding: 15px; border-radius: 5px; }
        input, button { padding: 10px; margin: 5px; width: 80%; border-radius: 5px; }
        button { background: #FFFC00; font-weight: bold; cursor: pointer; }
        #messages { text-align: left; max-height: 200px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>👻 Indian Snapchat</h1>
    <div id="chat">
        <input id="sender" placeholder="Your Name" />
        <input id="message" placeholder="Send a Snap/Message..." />
        <button onclick="sendSnap()">Send</button>
        <div id="messages"></div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function sendSnap() {
            const sender = document.getElementById('sender').value;
            const message = document.getElementById('message').value;
            if (sender && message) {
                socket.emit('send_snap', { sender, message });
                document.getElementById('message').value = '';
            }
        }
        socket.on('receive_snap', (data) => {
            const msgDiv = document.getElementById('messages');
            msgDiv.innerHTML += `<p><b>${data.sender}:</b> ${data.message}</p>`;
        });
    </script>
</body>
</html>
